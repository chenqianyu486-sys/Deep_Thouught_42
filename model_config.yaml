# LLM Model Configuration for Context Management
# Worker models: optimized for speed, smaller context window (250K tokens)
# Planner models: optimized for reasoning, larger context window (1M tokens)
# Use flash models due to limited budget

worker:
  model_tier: "worker"
  model_name: "deepseek/deepseek-v4-pro"
  reasoning_enabled: true
  reasoning_max_output_tokens: null
  max_tokens: 250000
  soft_threshold: 200000
  hard_limit: 220000
  token_budget: 200000
  preserve_turns: 40
  preserve_turns_aggressive: 10
  min_importance_threshold: 0.15
  min_importance_threshold_aggressive: 0.7
  preserve_turns_hard_limit: 25
  min_importance_threshold_hard_limit: 0.35
  history_retrieval_limit: 8
  history_retrieval_min_importance: 0.5
  fallback_models:
    - "qwen/qwen3.5-flash-02-23"
  cost_hard_limit: 10.00
planner:
  model_tier: "planner"
  model_name: "deepseek/deepseek-v4-pro"
  max_tokens: 1000000
  reasoning_enabled: true
  reasoning_max_output_tokens: null
  soft_threshold: 500000
  hard_limit: 600000
  token_budget: 500000
  preserve_turns: 60
  preserve_turns_aggressive: 10
  min_importance_threshold: 0.1
  min_importance_threshold_aggressive: 0.7
  preserve_turns_hard_limit: 40
  min_importance_threshold_hard_limit: 0.25
  history_retrieval_limit: 10
  history_retrieval_min_importance: 0.3
  fallback_models:
    - "qwen/qwen3.6-plus"
  cost_hard_limit: 10.00


# Fallback chain: models to try if primary fails
# Ordered by preference (first available is used)
worker_fallback_chain:
  - deepseek-v4-flash       # Primary: cheap, fast
  - stepfun-3.5-flash        # Backup: similar capability
  - xiaomi-mimo-v2-flash     # Backup: similar price point

planner_fallback_chain:
  - deepseek-v4-pro          # Primary: deep reasoning
  - qwen3.6-plus             # Backup: strong reasoning
  - xiaomi-mimo-v2.5-pro     # Backup: alternative provider

# Token budget reduction for cost savings
worker_token_budget_reduction: 0.80
planner_token_budget_reduction: 0.90

# Timeout scaling by design size (multiplier)
design_size_timeout_multiplier: 1.0
large_design_timeout_multiplier: 1.5
