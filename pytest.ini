[pytest]
asyncio_mode = auto
testpaths = tests/ optimizer/ skills/
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests that require external servers (Vivado, RapidWright MCP)
    skill_test: marks tests that require skill activation
